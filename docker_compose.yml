
services:
  php:
    build: .
    ports:
      - "8080:80"
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_NAME: rodados_del_sudeste
      DB_USER: root
      DB_PASSWORD: 123456

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: rodados_del_sudeste
    volumes:
      - datos_mysql:/var/lib/mysql

volumes:
  datos_mysql:
